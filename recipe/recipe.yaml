schema_version: 1

context:
  python_min: "3.11"
  name: lomap2
  package_name: lomap
  version: "3.3.0"

recipe:
  name: lomap2-suite
  version: ${{ version }}

source:
  url: https://github.com/OpenFreeEnergy/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 624cc8d71febd2e4d054456713670dd9993bd811e7ee5a02bab5ad134e38855b

build:
  number: 0

outputs:
  - package:
      name: lomap2-base
    build:
      noarch: python
    script: SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    python:
      entry_points:
        - lomap = lomap.dbmol:startup
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools
        - setuptools_scm
      run:
        - matplotlib-base
        - networkx
        - numpy
        - python >=${{ python_min }}
        - rdkit >=2024
    tests:
      - python:
          imports:
            - lomap
          pip_check: true
          python_version: ${{ python_min }}
      - requirements:
          run:
            - pip
            - pytest-xdist
            - python ${{ python_min }}.*
          script:
            - lomap --help
            - python -c "import ${{ name }}; print(${{ name }}.__version__)"
            - python -c "import ${{ name }}; assert(${{ name }}.__version__ == '${{ version }}')"
            - pytest -v -n auto --pyargs lomap
  - package:
      name: lomap2
    build:
      noarch: python
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools
        - setuptools_scm
      run:
        - gufe ~=1.0
        - ${{ pin_subpackage('lomap2-base', exact=True) }}
    tests:
      - python:
          imports:
            - lomap
          pip_check: true
          python_version: ${{ python_min }}
      - requirements:
          run:
            - pip
            - pytest-xdist
            - python ${{ python_min }}.*
          script:
            - lomap --help
            - python -c "import ${{ name }}; print(${{ name }}.__version__)"
            - python -c "import ${{ name }}; assert(${{ name }}.__version__ == '${{ version }}')"
            - pytest -v -n auto --pyargs lomap
  - package:
      name: lomap2-extra
    build:
      noarch: python
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools
        - setuptools_scm
      run:
        - pygraphviz
        - ${{ pin_subpackage('lomap2', exact=True) }}        
    tests:
      - python:
          imports:
            - lomap
          pip_check: true
          python_version: ${{ python_min }}
      - requirements:
          run:
            - pip
            - pytest-xdist
            - python ${{ python_min }}.*
          script:
            - lomap --help
            - python -c "import ${{ name }}; print(${{ name }}.__version__)"
            - python -c "import ${{ name }}; assert(${{ name }}.__version__ == '${{ version }}')"
            - pytest -v -n auto --pyargs lomap

about:
  homepage: https://openfree.energy/
  repository: https://github.com/OpenFreeEnergy/Lomap
  documentation: https://lomap.openfree.energy/en/latest/
  license: MIT
  license_file: LICENCE.txt
  summary: Alchemical mutation scoring map
  description: |
    Lead optimization mapper (LOMAP) is an automated algorithm to plan efficient 
    relative free energy calculations between potential ligands within a 
    substantial of compounds. The original LOMAP code was mainly based 
    on commercial APIs such as OpenEye and Schrodinger. 
    The aim of this project is to develop a new version of LOMAP based on 
    free avalaible APIs such as RDKit offering the scientific community 
    a free tool to plan in advance binding free energy calculations.

extra:
  feedstock-name: lomap2
  recipe-maintainers:
    - atravitz
    - mikemhenry
    - atravitz
    - IAlibay
    - dwhswenson
